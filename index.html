<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cida Fashion</title>
<style>
:root{
  --cream:#FBF1EC; --ink:#2B2118; --muted:#8A7A6E; --placeholder:#B3A296; --border:#EFE1D8;
  --accent:#8C6A34;
  --gold-1:#F8ECD2; --gold-2:#EAD7A8; --gold-border:#E9D8AE; --gold-label:#8A7357;
  --mint-bg:#DCEBDD; --mint-border:#BFDBC4; --mint-text:#2F5A41; --mint-icon-bg:#E8F1EB; --mint-icon-text:#3F6B4F;
  --blush-bg:#F6DEDA; --blush-border:#E9C3BC; --blush-text:#8B4238; --blush-icon-bg:#F3E1DC; --blush-icon-text:#9C4F45;
  --champagne-bg:#F4E7C7; --champagne-border:#E3CE9B; --champagne-text:#8C6A34;
  --creambtn-bg:#F3E9DD; --creambtn-border:#E4D3BE; --creambtn-text:#6B5738;
  --photo-bg:#F6E3DC; --photo-icon:#C9A97E;
  --amber-bg:#FBE3B0; --amber-text:#7A4B12;
  --neutral-bg:#EFE1D8; --neutral-text:#8A7A6E;
  --dark:#2B2118; --white:#FFFFFF;
  color-scheme: light;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Manrope',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent;}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;-webkit-tap-highlight-color:transparent;}
input,textarea{font-family:inherit;}
input::placeholder,textarea::placeholder{color:var(--placeholder);}
.serif{font-family:'Fraunces',Georgia,'Times New Roman',serif;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

.app-shell{width:100%;max-width:560px;margin:0 auto;min-height:100%;background:var(--cream);display:flex;flex-direction:column;position:relative;}
.scroll-area{flex:1 1 auto;display:flex;flex-direction:column;gap:18px;padding-bottom:28px;}
.topbar{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:22px 20px 14px;border-bottom:1px solid var(--border);background:var(--cream);}
.topbar .title{font-size:19px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.icon-btn{width:34px;height:34px;border-radius:999px;background:var(--white);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--ink);flex-shrink:0;cursor:pointer;}
.icon-btn.cream{background:var(--creambtn-bg);border-color:var(--creambtn-border);color:var(--creambtn-text);}

.tabbar{flex:0 0 auto;display:flex;border-top:1px solid var(--border);background:var(--white);padding:10px 12px calc(16px + env(safe-area-inset-bottom,0px));position:sticky;bottom:0;}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:#B3A296;}
.tabbar a span{font-size:11px;font-weight:600;}
.tabbar a.active{color:var(--accent);}
.tabbar a.active span{font-weight:700;}

.fab{position:absolute;right:20px;bottom:24px;width:56px;height:56px;border-radius:999px;background:var(--dark);color:var(--cream);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 22px rgba(43,33,24,.28);z-index:5;cursor:pointer;border:none;}
.fab.above-tabbar{bottom:96px;}

.balance-card{margin:0 24px;padding:22px;border-radius:22px;background:linear-gradient(135deg,var(--gold-1) 0%,var(--gold-2) 100%);border:1px solid var(--gold-border);display:flex;flex-direction:column;gap:12px;}
.balance-card .label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-label);}
.balance-card .amount{font-size:34px;font-weight:600;font-variant-numeric:tabular-nums;}
.pill-row{display:flex;gap:8px;flex-wrap:wrap;}
.pill{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;}
.pill.mint{background:var(--mint-bg);color:var(--mint-text);}
.pill.blush{background:var(--blush-bg);color:var(--blush-text);}

.btn{display:flex;align-items:center;justify-content:center;gap:7px;padding:13px;border-radius:999px;font-size:14px;font-weight:700;border:1px solid transparent;cursor:pointer;width:100%;}
.btn.mint{background:var(--mint-bg);border-color:var(--mint-border);color:var(--mint-text);}
.btn.blush{background:var(--blush-bg);border-color:var(--blush-border);color:var(--blush-text);}
.btn.cream{background:var(--creambtn-bg);border-color:var(--creambtn-border);color:var(--creambtn-text);}
.btn.champagne{background:var(--champagne-bg);border-color:var(--champagne-border);color:var(--champagne-text);}
.btn.gold-solid{background:linear-gradient(135deg,#9C7A3E 0%,#7A5C2C 100%);color:var(--cream);border:none;}
.btn.whatsapp{background:#2F5A41;color:#FBF1EC;font-size:16px;padding:17px;}
.btn.big{padding:15px;font-size:15px;}
.btn-row{margin:0 24px;display:flex;gap:12px;}

.tile-row{margin:0 24px;display:flex;gap:10px;}
.tile{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:12px 4px;border-radius:16px;border:1px solid transparent;cursor:pointer;background:none;}
.tile span{font-size:11.5px;font-weight:700;text-align:center;}
.tile.mint{background:var(--mint-bg);border-color:var(--mint-border);color:var(--mint-text);}
.tile.blush{background:var(--blush-bg);border-color:var(--blush-border);color:var(--blush-text);}
.tile.champagne{background:var(--champagne-bg);border-color:var(--champagne-border);color:var(--champagne-text);}

.stat-grid{margin:0 24px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
.stat-card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:4px;}
.stat-card .k{font-size:12px;color:var(--muted);}
.stat-card .v{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;}

.section-row{display:flex;justify-content:space-between;align-items:center;margin:6px 24px 0;}
.section-row .h{font-size:16px;font-weight:600;}
.section-row .link{font-size:12px;color:var(--accent);font-weight:700;}

.row-list{margin:0 24px;display:flex;flex-direction:column;gap:10px;}
.tx-row{display:flex;align-items:center;gap:12px;background:var(--white);border:1px solid var(--border);border-radius:14px;padding:12px 14px;}
.tx-icon{width:34px;height:34px;border-radius:999px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tx-icon.lg{width:36px;height:36px;}
.tx-body{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0;}
.tx-body .t{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tx-body .m{font-size:12px;color:var(--muted);}
.tx-value{font-size:14px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;}
.tx-end{display:flex;flex-direction:column;align-items:flex-end;gap:5px;}
.badge{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;}

.link-card{margin:0 24px;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:var(--champagne-bg);border:1px solid var(--champagne-border);color:var(--ink);cursor:pointer;}
.link-card .ic{width:36px;height:36px;border-radius:999px;background:var(--white);display:flex;align-items:center;justify-content:center;color:var(--accent);flex-shrink:0;position:relative;}
.link-card .body{flex:1;display:flex;flex-direction:column;gap:1px;}
.link-card .t{font-size:13.5px;font-weight:700;}
.link-card .m{font-size:12px;color:#7A6650;}
.dot-badge{position:absolute;top:-2px;right:-2px;width:9px;height:9px;border-radius:999px;background:#9C4F45;border:1.5px solid var(--champagne-bg);}

.segmented{margin:4px 24px 0;display:flex;background:var(--photo-bg);border-radius:999px;padding:4px;gap:4px;}
.segmented.tight{margin:0;}
.segmented button{flex:1;padding:9px 4px;border-radius:999px;border:none;font-size:12px;font-weight:700;cursor:pointer;background:transparent;color:var(--muted);}
.segmented button.active{background:var(--white);color:var(--accent);}

.chip-row{display:flex;gap:8px;flex-wrap:wrap;}
.chip{padding:9px 16px;border-radius:999px;border:1.5px solid var(--border);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;background:var(--white);color:var(--ink);flex-shrink:0;}
.chip.active{background:var(--accent);color:var(--cream);border-color:var(--accent);}
.chip.size{width:42px;height:42px;padding:0;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.chip.pay{flex:1;padding:11px 8px;text-align:center;}

.empty-state{margin:0 24px;padding:28px 20px;border-radius:18px;background:var(--white);border:1px dashed var(--border);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;color:var(--muted);}
.empty-state .t{font-size:14px;font-weight:700;color:var(--ink);}
.empty-state .m{font-size:12.5px;}

.form-body{flex:1 1 auto;display:flex;flex-direction:column;gap:18px;padding:20px 20px 24px;}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:12px;font-weight:700;color:var(--muted);}
.field input[type="text"],.field input[type="number"],.field textarea{border:1px solid var(--border);background:var(--white);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--ink);outline:none;width:100%;}
.field textarea{resize:none;}
.field-money{display:flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--white);border-radius:12px;padding:12px 14px;}
.field-money span{font-size:14px;color:var(--muted);}
.field-money input{border:none;outline:none;width:100%;font-size:14px;color:var(--ink);background:transparent;}
.field-date{display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--white);border-radius:12px;padding:12px 14px;}
.field-date input{border:none;outline:none;flex:1;font-size:14px;color:var(--ink);background:transparent;min-width:0;}
.field-label-solo{font-size:12px;font-weight:700;color:var(--muted);}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid-2.uneven{grid-template-columns:1.3fr 1fr;}
.form-footer{flex:0 0 auto;padding:14px 20px 22px;border-top:1px solid var(--border);background:var(--white);}
.err-msg{font-size:12px;color:#9C4F45;font-weight:700;margin-top:-8px;}

.photo-drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;height:150px;border-radius:16px;border:1.5px dashed #D8C3B4;background:var(--photo-bg);color:var(--accent);}
.photo-drop .t{font-size:13px;font-weight:700;}
.photo-drop .m{font-size:11px;color:var(--muted);}

.stepper{display:flex;align-items:center;gap:16px;}
.stepper button{width:40px;height:40px;border-radius:999px;border:1.5px solid var(--border);background:var(--white);font-size:18px;font-weight:700;color:var(--ink);cursor:pointer;}
.stepper .val{font-size:20px;font-weight:600;min-width:24px;text-align:center;}

.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:14px;background:var(--champagne-bg);border:1px solid var(--champagne-border);cursor:pointer;}
.toggle-row .body{display:flex;flex-direction:column;gap:2px;}
.toggle-row .t{font-size:13.5px;font-weight:700;color:var(--ink);}
.toggle-row .m{font-size:11.5px;color:#7A6650;}
.switch{position:relative;display:inline-block;width:44px;height:25px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;position:absolute;}
.switch .track{position:absolute;inset:0;background:var(--creambtn-border);border-radius:999px;transition:background .2s;}
.switch .thumb{position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:999px;background:var(--white);transition:transform .2s;box-shadow:0 1px 3px rgba(43,33,24,.25);}
.switch input:checked ~ .track{background:var(--accent);}
.switch input:checked ~ .track .thumb{transform:translateX(19px);}

.carousel-wrap{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;min-height:280px;padding:4px 0 0;}
.carousel-viewport{overflow:hidden;}
.carousel-track{display:flex;align-items:flex-start;transition:transform .4s cubic-bezier(.22,.61,.36,1);}
.card-active,.card-inactive{flex:0 0 auto;width:52vw;max-width:210px;min-width:168px;margin-right:14px;display:flex;flex-direction:column;border-radius:20px;overflow:hidden;background:var(--white);text-align:left;padding:0;}
.card-active{border:1.5px solid var(--champagne-border);box-shadow:0 16px 30px rgba(140,106,52,.18);}
.card-inactive{border:1px solid var(--border);opacity:.55;transform:scale(.9);cursor:pointer;}
.card-active .photo{height:150px;background:var(--photo-bg);display:flex;align-items:center;justify-content:center;color:var(--photo-icon);flex-shrink:0;}
.card-inactive .photo{height:150px;background:var(--photo-bg);display:flex;align-items:center;justify-content:center;color:var(--photo-icon);flex-shrink:0;}
.card-active .info{padding:16px;display:flex;flex-direction:column;gap:4px;flex:1;}
.card-inactive .info{padding:14px;display:flex;flex-direction:column;gap:4px;flex:1;}
.card-active .name{font-size:15px;font-weight:700;line-height:1.25;}
.card-inactive .name{font-size:13px;font-weight:700;color:var(--ink);}
.card-active .tag{font-size:11px;color:var(--muted);}
.card-active .price{font-size:23px;font-weight:600;margin-top:8px;font-variant-numeric:tabular-nums;}
.card-inactive .price{font-size:16px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;}
.card-active .teaser{font-size:12px;color:var(--accent);font-weight:700;}
.card-active .cta{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:6px;padding:11px;border-radius:999px;background:var(--creambtn-bg);border:1px solid var(--creambtn-border);color:var(--creambtn-text);font-size:12px;font-weight:700;}
.empty-catalog-card{width:min(72vw,260px);margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:14px;padding:36px 22px;border-radius:20px;background:var(--white);border:1.5px dashed var(--gold-border);text-align:center;cursor:pointer;}
.empty-catalog-card .ball{width:64px;height:64px;border-radius:999px;background:linear-gradient(135deg,var(--gold-1) 0%,var(--gold-2) 100%);border:1px solid var(--gold-border);display:flex;align-items:center;justify-content:center;color:var(--accent);}
.empty-catalog-card .t{font-size:15px;font-weight:700;}
.empty-catalog-card .m{font-size:12px;color:var(--muted);}

.carousel-controls{display:flex;align-items:center;justify-content:center;gap:12px;padding:14px 0 0;}
.carousel-controls .arrow{width:34px;height:34px;border-radius:999px;border:1px solid var(--border);background:var(--white);display:flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer;}
.carousel-controls .arrow[disabled]{opacity:.35;pointer-events:none;}
.dots{display:flex;gap:6px;align-items:center;}
.dots button{border-radius:999px;border:none;padding:0;cursor:pointer;background:var(--neutral-bg);width:6px;height:6px;}
.dots button.active{background:var(--accent);width:9px;height:9px;}

.hero-photo{height:260px;border-radius:18px;background:var(--photo-bg);display:flex;align-items:center;justify-content:center;color:var(--photo-icon);flex-shrink:0;}
.hero-photo.public{height:300px;border-radius:20px;width:100%;}
.product-title{font-size:22px;font-weight:600;line-height:1.2;}
.product-meta{font-size:13px;color:var(--muted);}
.product-price{font-size:30px;font-weight:600;margin-top:6px;font-variant-numeric:tabular-nums;}
.installment-list{display:flex;flex-direction:column;gap:6px;margin-top:2px;}
.installment-row{display:flex;align-items:center;justify-content:space-between;padding:10px 4px;border-bottom:1px solid #F2E7DD;font-size:13.5px;font-variant-numeric:tabular-nums;}
.installment-row .n{font-weight:600;}

.public-page{width:100%;box-sizing:border-box;background:var(--cream);min-height:100%;display:flex;flex-direction:column;align-items:center;gap:18px;padding:26px 22px 40px;max-width:560px;margin:0 auto;}
.public-logo{width:148px;height:auto;display:block;}
.public-info{width:100%;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;}
.public-info .name{font-size:23px;font-weight:600;}
.public-info .meta{font-size:13px;color:var(--muted);}
.public-info .price{font-size:32px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums;}
.public-info .teaser{font-size:13px;color:var(--accent);font-weight:700;}
.public-caption{font-size:12px;color:var(--muted);text-align:center;margin-top:-10px;}

.brand-header{display:flex;flex-direction:column;align-items:center;padding:30px 24px 4px;}
.brand-header img{width:min(220px,58vw);height:auto;display:block;}
.greeting{padding:0 24px;display:flex;flex-direction:column;gap:4px;}
.greeting .h{font-size:25px;font-weight:600;line-height:1.15;text-align:center;}
.greeting .d{font-size:13px;color:var(--muted);text-align:center;}

.share-box{margin:0 24px;padding:14px;border-radius:14px;background:var(--white);border:1px solid var(--border);display:flex;flex-direction:column;gap:10px;}
.share-box .link-text{font-size:12px;color:var(--muted);word-break:break-all;background:var(--photo-bg);border-radius:10px;padding:10px 12px;}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--dark);color:var(--cream);font-size:13px;font-weight:600;padding:10px 18px;border-radius:999px;box-shadow:0 10px 24px rgba(0,0,0,.25);z-index:50;}
.readonly-banner{margin:0 24px;padding:10px 14px;border-radius:12px;background:var(--amber-bg);color:var(--amber-text);font-size:12px;font-weight:700;text-align:center;}
</style>
</head>

/* ---------- utilities ---------- */
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function fmtBRL(n){
  n = Number(n) || 0;
  return n.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function genId(prefix){
  return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}
function todayISO(){
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function parseISODate(s){ return new Date(s + 'T00:00:00'); }
function weekdayDateLabel(){
  var days = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
  var months = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  var d = new Date();
  return days[d.getDay()] + ', ' + d.getDate() + ' de ' + months[d.getMonth()];
}
function greetingWord(){
  var h = new Date().getHours();
  return h < 12 ? 'Bom dia' : (h < 18 ? 'Boa tarde' : 'Boa noite');
}
function brandMarkHTML(size, withWordmark){
  size = size || 96;
  // The approved logo art already includes the "Cida Fashion" wordmark baked in,
  // so it is always shown as a single image at a legible width.
  var w = Math.round(size * 1.9);
  return '<div><img src="logo.png" alt="Cida Fashion" style="width:' + w + 'px;height:auto;display:block;margin:0 auto;" /></div>';
}

/* ---------- state ---------- */
var STATE = { products: [], transactions: [], debts: [] };
var adminLoaded = false;

function totalEntradas(){ return STATE.transactions.filter(function(t){return t.type==='entrada';}).reduce(function(s,t){return s+t.value;},0); }
function totalSaidas(){ return STATE.transactions.filter(function(t){return t.type==='saida';}).reduce(function(s,t){return s+t.value;},0); }
function saldoAtual(){ return totalEntradas() - totalSaidas(); }
function vendasHojeCount(){
  var t = todayISO();
  return STATE.transactions.filter(function(x){return x.type==='entrada' && x.date===t;}).length;
}
function recentTx(n){
  return STATE.transactions.slice().sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); }).slice(0,n);
}
function openDebts(){ return STATE.debts.filter(function(d){return !d.paid;}); }
function openDebtsTotal(){ return openDebts().reduce(function(s,d){return s+d.value;},0); }
function debtStatusInfo(d){
  var today = new Date(); today.setHours(0,0,0,0);
  var dueDate = parseISODate(d.due);
  var diffDays = Math.round((dueDate - today) / 86400000);
  var dd = String(dueDate.getDate()).padStart(2,'0');
  var mm = String(dueDate.getMonth()+1).padStart(2,'0');
  var dateStr = dd + '/' + mm;
  if(d.paid) return {label:'Paga', style:'background:#DCEBDD;color:#2F5A41;', meta:'Paga'};
  if(diffDays < 0) return {label:'Atrasada', style:'background:#F6DEDA;color:#8B4238;', meta:'Venceu há ' + Math.abs(diffDays) + (Math.abs(diffDays)===1?' dia':' dias')};
  if(diffDays === 0) return {label:'Vence hoje', style:'background:#FBE3B0;color:#7A4B12;', meta:'Vence hoje'};
  if(diffDays <= 5) return {label:'Vence em ' + diffDays + 'd', style:'background:#F4E7C7;color:#8C6A34;', meta:'Vence em ' + diffDays + (diffDays===1?' dia':' dias')};
  return {label:'A vencer', style:'background:#EFE1D8;color:#8A7A6E;', meta:'Vence em ' + dateStr};
}
function debtsVenceHojeCount(){
  return openDebts().filter(function(d){ return debtStatusInfo(d).label === 'Vence hoje'; }).length;
}

/* ---------- persistence (real backend via Supabase Edge Function) ---------- */
function showToast(msg){
  var old = document.querySelector('.toast');
  if(old) old.remove();
  var t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 2600);
}

function pinHeader(){
  return { 'Content-Type': 'application/json', 'X-Cida-Pin': localStorage.getItem('cida_pin') || '' };
}
function apiGet(path, headers){
  return fetch(API_BASE + path, { headers: headers || {} }).then(function(r){
    return r.json().then(function(data){ if(!r.ok) throw {status:r.status, data:data}; return data; });
  });
}
function apiPost(path, body, auth){
  return fetch(API_BASE + path, { method:'POST', headers: auth ? pinHeader() : {'Content-Type':'application/json'}, body: JSON.stringify(body) }).then(function(r){
    return r.json().then(function(data){ if(!r.ok) throw {status:r.status, data:data}; return data; });
  });
}
function apiPatch(path, body){
  return fetch(API_BASE + path, { method:'PATCH', headers: pinHeader(), body: JSON.stringify(body) }).then(function(r){
    return r.json().then(function(data){ if(!r.ok) throw {status:r.status, data:data}; return data; });
  });
}

function loadingHtml(){
  return '<div class="app-shell" style="min-height:100vh;align-items:center;justify-content:center;display:flex;">' +
    '<div class="serif" style="font-size:15px;color:var(--muted);">Carregando…</div></div>';
}

function showPinGate(errorMsg){

    (errorMsg ? ('<div class="err-msg" style="margin-top:0;">' + esc(errorMsg) + '</div>') : '') +

    '</form></div>';

  if(el) el.focus();
}

function loadAdminState(pin){
  var root = document.getElementById('root');
  root.innerHTML = loadingHtml();
  apiGet('/api/state', {'X-Cida-Pin': pin}).then(function(data){
    STATE = {
      products: Array.isArray(data.products) ? data.products : [],
      transactions: Array.isArray(data.transactions) ? data.transactions : [],
      debts: Array.isArray(data.debts) ? data.debts : []
    };
    adminLoaded = true;
    renderView();
  }).catch(function(err){
    localStorage.removeItem('cida_pin');
    showPinGate(err && err.status === 401 ? 'PIN incorreto. Tente novamente.' : 'Não foi possível conectar. Tente novamente.');
  });
}

function bootAdmin(){
  var pin = localStorage.getItem('cida_pin');
  if(!pin){ showPinGate(); return; }
  loadAdminState(pin);
}

function renderPublicProduct(p){
  return viewProdutoPublicFromProduct(p);
}

function bootPublic(id){
  var root = document.getElementById('root');
  root.innerHTML = loadingHtml();
  apiGet('/api/product/' + encodeURIComponent(id)).then(function(p){
    root.innerHTML = renderPublicProduct(p);
  }).catch(function(){
    root.innerHTML = renderPublicProduct(null);
  });
}

function boot(){
  var route = currentRoute();
  if(adminLoaded){ renderView(); return; }
  if(route.indexOf('p-') === 0){ bootPublic(route.slice(2)); }
  else{ bootAdmin(); }
}

/* ---------- router ---------- */
function currentRoute(){
  var h = (location.hash || '').replace('#','');
  return h || 'home';
}
function navigate(hash){ location.hash = hash; }

/* ---------- shared builders ---------- */
function topBar(title, backHash, opts){
  opts = opts || {};
  var rightHtml = opts.right || '';
  return '<div class="topbar">' +
    '<a class="icon-btn" data-nav="' + backHash + '" aria-label="Voltar">' + ICON.back + '</a>' +
    '<div class="title serif">' + esc(title) + '</div>' + rightHtml +
    '</div>';
}
function tabBar(active){
  function item(hash, icon, label, key){
    return '<a data-nav="' + hash + '" class="' + (active===key?'active':'') + '">' + icon + '<span>' + label + '</span></a>';
  }
  return '<nav class="tabbar">' +
    item('home', ICON.home, 'Início', 'home') +
    item('catalogo', ICON.grid, 'Catálogo', 'catalogo') +
    item('caixa', ICON.wallet, 'Caixa', 'caixa') +

function balanceCard(label, amount, showPills){
  var pills = showPills ? (
    '<div class="pill-row">' +
      '<div class="pill mint">' + ICON.up + 'Entradas R$ ' + fmtBRL(totalEntradas()) + '</div>' +
      '<div class="pill blush">' + ICON.down + 'Saídas R$ ' + fmtBRL(totalSaidas()) + '</div>' +

    '<div class="amount serif">R$ ' + fmtBRL(amount) + '</div>' + pills + '</div>';

function chipRow(groupName, values, selected, extraClass){

  }).join('') + '</div>';
}
function txRowHTML(tx){
  var isEntrada = tx.type === 'entrada';

function debtRowHTML(d){

/* ---------- carousel layout (measurement-based centering) ---------- */
function layoutCarousel(){
  var track = document.getElementById('carousel-track');
  if(!track || !track.children.length) return;
  var viewport = track.parentElement;
  var first = track.children[0];
  var cw = first.getBoundingClientRect().width;
  var vw = viewport.getBoundingClientRect().width;
  var padLeft = Math.max((vw - cw) / 2, 12);
  var gap = 14;
  var step = cw + gap;
  track.style.paddingLeft = padLeft + 'px';
  track.style.transform = 'translateX(' + (-(vState.activeIndex * step)) + 'px)';
}

/* ---------- render dispatch ---------- */
function renderView(){
  var route = currentRoute();
  var root = document.getElementById('root');
  var html;
  var isNewView = (vState._route !== route);
  if(isNewView){ vState = { _route: route }; }

  if(route === 'home') html = viewHome();
  else if(route === 'catalogo') html = viewCatalogo();
  else if(route.indexOf('produto-') === 0) html = viewProdutoOwner(route.slice(8));
  else if(route.indexOf('p-') === 0) html = viewProdutoPublic(route.slice(2));
  else if(route === 'nova-peca') html = viewNovaPeca();
  else if(route === 'caixa') html = viewCaixa();
  else if(route === 'dividas') html = viewDividas();
  else if(route === 'nova-venda') html = viewNovaVenda();
  else if(route === 'nova-saida') html = viewNovaSaida();
  else if(route === 'nova-divida') html = viewNovaDivida();
  else html = viewNotFound('home');

  root.innerHTML = html;
  window.scrollTo(0,0);
  if(route === 'catalogo'){
    requestAnimationFrame(layoutCarousel);
  }
}

/* ---------- event delegation ---------- */
document.addEventListener('click', function(e){
  var nav = e.target.closest('[data-nav]');
  if(nav){
    e.preventDefault();
    navigate(nav.getAttribute('data-nav'));
    return;
  }
  var action = e.target.closest('[data-action]');
  if(!action) return;
  var act = action.getAttribute('data-action');

  if(act === 'pick-category'){
    vState.category = action.getAttribute('data-value');
    vState.activeIndex = 0;
    renderView();
  }else if(act === 'select-card'){
    vState.activeIndex = parseInt(action.getAttribute('data-index'),10);
    renderView();
  }else if(act === 'carousel-prev'){
    vState.activeIndex = Math.max(0, vState.activeIndex - 1);
    renderView();
  }else if(act === 'carousel-next'){
    var route = currentRoute();
    var products = vState.category==='Todos' ? STATE.products : STATE.products.filter(function(p){return p.category===vState.category;});
    vState.activeIndex = Math.min(products.length-1, vState.activeIndex + 1);
    renderView();
  }else if(act === 'set-modo'){
    vState.modo = action.getAttribute('data-value');
    renderView();
  }else if(act === 'toggle-share'){
    vState.showShare = !vState.showShare;
    renderView();
  }else if(act === 'copy-link'){
    var link = action.getAttribute('data-link');
    var done = function(){ showToast('Link copiado!'); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(link).then(done).catch(function(){
        showToast('Não foi possível copiar automaticamente. Selecione o link acima.');
      });
    }else{
      showToast('Selecione o link acima para copiar.');
    }
  }else if(act === 'qty-dec'){
    vState.qty = Math.max(0, (vState.qty||1) - 1);
    document.getElementById('qty-val').textContent = vState.qty;
  }else if(act === 'qty-inc'){
    vState.qty = (vState.qty||1) + 1;
    document.getElementById('qty-val').textContent = vState.qty;
  }else if(act === 'tx-filter'){
    vState.filter = action.getAttribute('data-value');
    renderView();
  }else if(act === 'toggle-debt'){
    var id = action.getAttribute('data-id');
    var d = STATE.debts.find(function(x){return x.id===id;});
    if(d){
      var nextPaid = !d.paid;
      apiPatch('/api/debts/' + encodeURIComponent(id), {paid: nextPaid}).then(function(row){
        d.paid = row.paid;
        renderView();
      }).catch(function(){
        showToast('Não foi possível atualizar agora.');
      });
    }
  }else if(act === 'toggle-alert'){
    vState.alertar = !vState.alertar;
    var cb = action.querySelector('input[type="checkbox"]');
    if(cb) cb.checked = vState.alertar;
  }
});

/* Chip selections inside forms must NOT trigger a full re-render — the view
   HTML is rebuilt from vState alone, so re-rendering would wipe out any
   free-text the viewer already typed into sibling fields (uncontrolled
   inputs). Toggle the visual state in place instead. */
document.addEventListener('click', function(e){
  var chip = e.target.closest('[data-chip-group]');
  if(!chip) return;
  var group = chip.getAttribute('data-chip-group');
  var value = chip.getAttribute('data-chip-value');
  vState[group] = value;
  var all = document.querySelectorAll('[data-chip-group="' + group + '"]');
  for(var i=0;i<all.length;i++){
    if(all[i].getAttribute('data-chip-value') === value) all[i].classList.add('active');
    else all[i].classList.remove('active');
  }
});

document.addEventListener('input', function(e){
  if(e.target && e.target.getAttribute && e.target.getAttribute('data-action') === 'juros-input'){

        return '<div class="installment-row"><div class="n">' + n + 'x</div><div>' + label + '</div></div>';
      }).join('');

document.addEventListener('submit', function(e){
  var form = e.target;
  e.preventDefault();

  if(form.id === 'form-pin'){
    var pinVal = document.getElementById('pin-input').value.trim();
    if(!pinVal) return;
    apiPost('/api/auth', {pin: pinVal}).then(function(res){
      if(res && res.ok){ localStorage.setItem('cida_pin', pinVal); loadAdminState(pinVal); }
      else{ showPinGate('PIN incorreto. Tente novamente.'); }
    }).catch(function(){ showPinGate('Não foi possível verificar agora. Tente novamente.'); });

  }else if(form.id === 'form-nova-peca'){
    var nome = document.getElementById('nome').value.trim();
    var preco = parseFloat(document.getElementById('preco').value);
    var cor = document.getElementById('cor').value.trim();
    if(!nome || !(preco > 0)){ showFormError('Preencha o nome e um preço válido.'); return; }
    var tag = 'Tam. ' + vState.tamanho + (cor ? (' · Cor ' + cor) : '') + ' · Estoque: ' + (vState.qty||0);
    apiPost('/api/products', {
      name: nome, category: vState.categoria, size: vState.tamanho,
      color: cor, price: preco, stock: vState.qty||0, tag: tag
    }, true).then(function(row){
      STATE.products.push(row);
      navigate('catalogo'); renderView();
    }).catch(function(err){
      showFormError(err && err.status === 401 ? 'PIN expirou. Volte e entre de novo.' : 'Não foi possível salvar. Tente novamente.');
    });

  }else if(form.id === 'form-nova-venda'){
    var data = document.getElementById('data-venda').value || todayISO();
    var peca = document.getElementById('peca-venda').value.trim();
    var valor = parseFloat(document.getElementById('valor-venda').value);
    var obs = document.getElementById('obs-venda').value.trim();
    if(!(valor > 0)){ showFormError('Informe um valor válido para a venda.'); return; }
    var desc = peca || 'Venda registrada';
    var metaParts = [data===todayISO()?'Hoje':data, vState.pagamento];
    apiPost('/api/transactions', {
      type:'entrada', desc: desc, value: valor, date: data,
      meta: metaParts.join(' · '), note: obs
    }, true).then(function(row){
      STATE.transactions.push(row);
      navigate('caixa'); renderView();
    }).catch(function(err){
      showFormError(err && err.status === 401 ? 'PIN expirou. Volte e entre de novo.' : 'Não foi possível salvar. Tente novamente.');
    });

  }else if(form.id === 'form-nova-saida'){
    var data2 = document.getElementById('data-saida').value || todayISO();
    var desc2 = document.getElementById('desc-saida').value.trim();
    var valor2 = parseFloat(document.getElementById('valor-saida').value);
    if(!desc2 || !(valor2 > 0)){ showFormError('Preencha a descrição e um valor válido.'); return; }
    apiPost('/api/transactions', {
      type:'saida', desc: desc2, value: valor2, date: data2,
      meta: (data2===todayISO()?'Hoje':data2) + ' · ' + vState.categoria
    }, true).then(function(row){
      STATE.transactions.push(row);
      navigate('caixa'); renderView();
    }).catch(function(err){
      showFormError(err && err.status === 401 ? 'PIN expirou. Volte e entre de novo.' : 'Não foi possível salvar. Tente novamente.');
    });

  }else if(form.id === 'form-nova-divida'){
    var desc3 = document.getElementById('desc-divida').value.trim();
    var valor3 = parseFloat(document.getElementById('valor-divida').value);
    var venc = document.getElementById('venc-divida').value;
    if(!desc3 || !(valor3 > 0) || !venc){ showFormError('Preencha descrição, valor e data de vencimento.'); return; }
    apiPost('/api/debts', {
      desc: desc3, value: valor3, due: venc, category: vState.categoria,
      alert: !!vState.alertar
    }, true).then(function(row){
      STATE.debts.push(row);
      navigate('dividas'); renderView();
    }).catch(function(err){
      showFormError(err && err.status === 401 ? 'PIN expirou. Volte e entre de novo.' : 'Não foi possível salvar. Tente novamente.');
    });
  }
});

/* ---------- boot ---------- */
window.addEventListener('hashchange', boot);
boot();
</script>
</body>
</html>
